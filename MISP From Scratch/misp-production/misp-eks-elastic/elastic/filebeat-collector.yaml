# filebeat-collector.yaml  (Elastic integration — METHOD 2: Filebeat Threat Intel module)
#
# Runs Filebeat IN-CLUSTER as a single-replica poller. It pulls IOCs from MISP over
# the INTERNAL service (http://misp-nginx...) so the MISP REST API never has to be
# exposed publicly, and ships them OUT to your existing/external Elastic over TLS
# with an API key. This is the recommended collector placement for external Elastic.
#
# Substitute ${NAMESPACE}. Create the secret below with your MISP sync-user auth key
# and an Elasticsearch API key before applying.
---
apiVersion: v1
kind: Secret
metadata:
  name: filebeat-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  MISP_API_TOKEN: "REPLACE_WITH_MISP_SYNC_USER_AUTHKEY"   # from scripts/create-misp-sync-user.sh
  ELASTIC_HOST: "https://your-deployment.es.eu-west-2.aws.elastic-cloud.com:443"
  ELASTIC_API_KEY: "REPLACE_WITH_ELASTIC_API_KEY"          # id:api_key, base64 as Elastic expects
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: ${NAMESPACE}
data:
  filebeat.yml: |
    filebeat.modules:
      - module: threatintel
        misp:
          enabled: true
          var.input: httpjson
          # Internal MISP service — no public exposure of the REST API
          var.url: "http://misp-nginx.${NAMESPACE}.svc.cluster.local/events/restSearch"
          var.api_token: "${MISP_API_TOKEN}"
          var.first_interval: 24h
          var.interval: 5m
          # Internal hop is plain HTTP (ALB terminates external TLS). If you serve
          # internal HTTPS instead, set this to 'full' and mount the CA.
          var.ssl.verification_mode: none
          var.filters:
            type: ["md5","sha1","sha256","url","domain","hostname","ip-src","ip-dst"]
            tags: ['workflow:state="complete"']

    output.elasticsearch:
      hosts: ["${ELASTIC_HOST}"]
      api_key: "${ELASTIC_API_KEY}"
      ssl.verification_mode: full

    # Filebeat's own monitoring/logging
    logging.level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebeat-misp
  namespace: ${NAMESPACE}
  labels:
    app: filebeat-misp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebeat-misp
  template:
    metadata:
      labels:
        app: filebeat-misp
    spec:
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.19.4   # match your Elastic version
          args: ["-e", "-c", "/etc/filebeat/filebeat.yml"]
          envFrom:
            - secretRef:
                name: filebeat-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat
              readOnly: true
            - name: data
              mountPath: /usr/share/filebeat/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: filebeat-config
        - name: data
          emptyDir: {}
