# 01-external-secrets.yaml
# Pulls the two JSON secrets from AWS Secrets Manager into Kubernetes Secrets named
# exactly as the MISP deployment expects: mysql-credentials and instance-secrets.
# Requires the External Secrets Operator (installed by Terraform addons.tf).

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: ${NAMESPACE}
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-misp
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-credentials
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: mysql-credentials      # -> k8s Secret consumed via envFrom
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: misp/mysql-credentials
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: instance-secrets
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: instance-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: misp/instance-secrets
