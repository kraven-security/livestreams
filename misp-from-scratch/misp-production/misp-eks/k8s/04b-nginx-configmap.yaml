# 04b-nginx-configmap.yaml
# As of CORE_TAG>=v2.5.42, misp-docker's nginx container runs stock nginx (+tini)
# with the whole config supplied via ConfigMap — no more env-var-driven templating
# (NGINX_X_FORWARDED_FOR / NGINX_SET_REAL_IP_FROM / DISABLE_SSL_REDIRECT are gone).
# This is our own copy of upstream's kubernetes/manifests/nginx-cm.yaml with
# `real_ip_header` / `set_real_ip_from ${VPC_CIDR}` added into the server block —
# without those, MISP can't trust the ALB's forwarded scheme/IP and the
# redirect-loop / CSRF errors this stack works around come back. There's also no
# more :80/:443 split — nginx only ever serves plain HTTP on 8080; the ALB (ACM
# cert) is the only TLS termination point now.
#
# RENDER THIS FILE DIFFERENTLY FROM THE OTHERS: it contains nginx's own $uri /
# $is_args / $query_string / $path_info variables, which plain `envsubst` (no
# shell-format list) silently blanks out because they aren't real shell env vars
# — that corrupts the config without erroring. Render with the variable list
# restricted to just what we want substituted:
#   envsubst '${NAMESPACE} ${VPC_CIDR}' < 04b-nginx-configmap.yaml | kubectl apply -f -
# NOT the generic `render()` helper used for every other file in this directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: ${NAMESPACE}
data:
  nginx.conf: |
    user www-data;
    worker_processes auto;
    worker_cpu_affinity auto;
    pid /tmp/nginx.pid;
    error_log stderr warn;

    events {
            worker_connections 768;
    }

    http {
            sendfile on;
            tcp_nopush on;
            types_hash_max_size 2048;
            server_tokens off;

            include /etc/nginx/mime.types;
            default_type application/octet-stream;

            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers off;

            access_log /var/log/nginx/access.log;

            gzip on;

            include /etc/nginx/conf.d/*.conf;
            include /etc/nginx/sites-enabled/*;

            server {
                listen 8080 default_server;
                listen [::]:8080 default_server;

                access_log off;
                log_not_found off;
                error_log  /dev/stderr error;

                root /var/www/MISP/app/webroot;
                index index.php;

                client_max_body_size 50M;

                # Trust X-Forwarded-For from the ALB (in-VPC) so MISP sees the
                # real client IP/scheme instead of the ALB's — required to avoid
                # redirect-loop/CSRF errors behind a TLS-terminating load balancer.
                real_ip_header X-Forwarded-For;
                real_ip_recursive on;
                set_real_ip_from ${VPC_CIDR};

                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Download-Options "noopen" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Permitted-Cross-Domain-Policies "none" always;
                add_header X-Robots-Tag "none" always;

                fastcgi_hide_header X-Powered-By;
                server_tokens off;

                location / {
                    try_files $uri $uri/ /index.php$is_args$query_string;
                }

                location ~ ^/[^/]+\.php(/|$) {
                    include snippets/fastcgi-php.conf;
                    fastcgi_pass misp-php:9002;
                    fastcgi_read_timeout 300s;
                    fastcgi_send_timeout 300s;
                    fastcgi_connect_timeout 300s;
                    fastcgi_split_path_info ^(.+\.php)(/.+)$;
                    set $path_info $fastcgi_path_info;
                    fastcgi_param PATH_INFO $path_info;
                    fastcgi_param HTTPS on;
                }
            }
    }
