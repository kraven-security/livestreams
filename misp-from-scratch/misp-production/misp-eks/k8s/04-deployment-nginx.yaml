# 04-deployment-nginx.yaml
# Adapted from MISP/misp-docker kubernetes/manifests/deployment-nginx.yaml.
# As of CORE_TAG>=v2.5.42, nginx is the stock binary (+tini), config supplied
# entirely by the nginx-conf ConfigMap (04b-nginx-configmap.yaml) — no more
# custom entrypoint script or NGINX_*/DISABLE_SSL_REDIRECT env vars. The ALB
# terminates TLS (ACM); nginx only ever serves plain HTTP on :8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: misp-nginx
  namespace: ${NAMESPACE}
  labels:
    app: misp-nginx
spec:
  replicas: 2            # nginx is a stateless proxy — safe to scale
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: misp-nginx
  template:
    metadata:
      labels:
        app: misp-nginx
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 33
        runAsUser: 33     # www-data
      containers:
        - name: nginx
          image: ghcr.io/misp/misp-docker/misp-core:${CORE_TAG}  # same image, nginx entrypoint
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini"]
          args: ["nginx", "--", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: instance-secrets        # BASE_URL etc.
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1024Mi"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-body
              mountPath: /var/lib/nginx/
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-conf
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-body
          emptyDir:
            sizeLimit: 50Mi
