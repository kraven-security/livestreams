# 02-services.yaml
# ClusterIP services. The nginx pod reaches PHP-FPM via the `misp-php` service on
# 9002 — the official misp-docker image's /kubernetes/entrypoint_nginx.sh hardcodes
# `fastcgi_pass misp-php:9002` (sed-replaced, not configurable via env var), so this
# name is not cosmetic. The ALB targets the `misp-nginx` service.

apiVersion: v1
kind: Service
metadata:
  name: misp-php        # MUST be "misp-php" — nginx fastcgi_pass targets misp-php:9002
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: misp
  ports:
    - name: php-fpm
      port: 9002
      targetPort: 9002
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: misp-nginx
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: misp-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
