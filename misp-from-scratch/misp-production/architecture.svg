<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .t   { fill:#E6EDF3; }
      .mut { fill:#8A97A4; }
      .mono{ font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace; }
      .card{ fill:#161B22; }
      .inner{ fill:#1B2230; }
    </style>
    <marker id="ah-cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#38BDF8"/></marker>
    <marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2DD4BF"/></marker>
    <marker id="ah-sand" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#E3B341"/></marker>
    <marker id="ah-violet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#A78BFA"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="730" fill="#0E1116"/>

  <!-- header -->
  <text x="40" y="46" class="mono" fill="#38BDF8" font-size="12.5" letter-spacing="3">LIVE BUILD · DEPLOYED ON STREAM</text>
  <text x="40" y="80" class="t" font-size="27" font-weight="700">MISP on AWS EKS — Production Deployment</text>
  <text x="40" y="104" class="mut" font-size="13.5">CORE_TAG v2.5.42 · externalized state · locked-down networking · TLS</text>

  <!-- VPC -->
  <rect x="270" y="120" width="970" height="540" rx="16" fill="none" stroke="#2A3340" stroke-width="1.5"/>
  <text x="290" y="146" class="mut mono" font-size="12.5">AWS VPC · 10.42.0.0/16 · eu-west-1</text>

  <!-- EKS -->
  <rect x="298" y="170" width="560" height="450" rx="14" fill="#0F141B" stroke="#2A3340" stroke-width="1.3"/>
  <text x="318" y="195" class="mut mono" font-size="12.5">Amazon EKS — private subnets</text>

  <!-- Internet -->
  <rect x="40" y="210" width="180" height="58" rx="12" class="card" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="56" cy="228" r="4" fill="#38BDF8"/>
  <text x="68" y="233" class="t" font-size="15" font-weight="600">Internet</text>
  <text x="60" y="256" class="mut" font-size="12">Analysts · API clients</text>

  <!-- ALB -->
  <rect x="40" y="300" width="180" height="78" rx="12" class="card" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="56" cy="319" r="4" fill="#38BDF8"/>
  <text x="68" y="324" class="t" font-size="15" font-weight="600">Application LB</text>
  <text x="60" y="347" class="mut" font-size="12">AWS LB Controller</text>
  <text x="60" y="365" class="mut" font-size="12">TLS termination · ACM</text>

  <!-- nginx -->
  <rect x="326" y="212" width="230" height="86" rx="12" class="card" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="342" cy="232" r="4" fill="#2DD4BF"/>
  <text x="354" y="237" class="t" font-size="15" font-weight="600">nginx  ×2</text>
  <text x="346" y="260" class="mut" font-size="12">stock nginx · ConfigMap-driven</text>
  <text x="346" y="280" class="mono" fill="#2DD4BF" font-size="11.5">serves :8080 (04b nginx-cm)</text>

  <!-- misp pod -->
  <rect x="326" y="322" width="230" height="140" rx="12" class="card" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="342" cy="342" r="4" fill="#2DD4BF"/>
  <text x="354" y="347" class="t" font-size="15" font-weight="600">misp pod</text>
  <rect x="346" y="356" width="190" height="90" rx="9" class="inner" stroke="#2A3340" stroke-width="1"/>
  <text x="362" y="382" class="t" font-size="13.5" font-weight="600">misp-core</text>
  <text x="362" y="402" class="mut" font-size="12">PHP-FPM application</text>
  <text x="362" y="430" class="mono" fill="#2DD4BF" font-size="12.5">:9002</text>

  <!-- misp-modules (own Deployment as of v2.5.42) -->
  <rect x="326" y="492" width="230" height="100" rx="12" class="card" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="342" cy="512" r="4" fill="#2DD4BF"/>
  <text x="354" y="517" class="t" font-size="15" font-weight="600">misp-modules</text>
  <text x="346" y="540" class="mut" font-size="12">separate Deployment + Service</text>
  <text x="346" y="560" class="mut" font-size="12">enrichment · shares Redis queue</text>
  <text x="346" y="580" class="mono" fill="#2DD4BF" font-size="11.5">modules:v3.0.8 · :6666</text>

  <!-- RDS -->
  <rect x="900" y="185" width="300" height="86" rx="12" class="card" stroke="#E3B341" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="916" cy="204" r="4" fill="#E3B341"/>
  <text x="928" y="209" class="t" font-size="15" font-weight="600">Amazon RDS</text>
  <text x="920" y="232" class="mut" font-size="12.5">MariaDB (not MySQL 8)</text>
  <text x="920" y="258" class="mono" fill="#E3B341" font-size="12.5">:3306</text>

  <!-- ElastiCache -->
  <rect x="900" y="300" width="300" height="86" rx="12" class="card" stroke="#E3B341" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="916" cy="319" r="4" fill="#E3B341"/>
  <text x="928" y="324" class="t" font-size="15" font-weight="600">ElastiCache</text>
  <text x="920" y="347" class="mut" font-size="12.5">Redis · cache + job queues</text>
  <text x="920" y="373" class="mono" fill="#E3B341" font-size="12.5">:6379 · no TLS (SG-isolated)</text>

  <!-- S3 -->
  <rect x="900" y="415" width="300" height="86" rx="12" class="card" stroke="#E3B341" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="916" cy="434" r="4" fill="#E3B341"/>
  <text x="928" y="439" class="t" font-size="15" font-weight="600">Amazon S3</text>
  <text x="920" y="462" class="mut" font-size="12.5">attachments</text>
  <text x="1090" y="462" class="mut mono" font-size="11.5">scoped IAM keys</text>

  <!-- Secrets Manager -->
  <rect x="900" y="530" width="300" height="86" rx="12" class="card" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.4"/>
  <circle cx="916" cy="549" r="4" fill="#A78BFA"/>
  <text x="928" y="554" class="t" font-size="15" font-weight="600">AWS Secrets Manager</text>
  <text x="920" y="577" class="mut" font-size="12.5">MISP crypto · endpoints</text>
  <text x="920" y="603" class="mut mono" font-size="11.5">ENCRYPTION_KEY · SALT · UUID</text>

  <!-- FLOWS -->
  <!-- Internet -> ALB -->
  <polyline points="130,268 130,300" fill="none" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#ah-cyan)"/>
  <g><rect x="88" y="276" width="92" height="22" rx="6" fill="#0E1116" stroke="#38BDF8" stroke-opacity="0.6"/><text x="134" y="291" text-anchor="middle" class="mono" fill="#38BDF8" font-size="11.5">HTTPS · 443</text></g>

  <!-- ALB -> nginx -->
  <polyline points="220,338 258,338 258,255 326,255" fill="none" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#ah-cyan)"/>
  <g><rect x="228" y="300" width="86" height="22" rx="6" fill="#0E1116" stroke="#38BDF8" stroke-opacity="0.6"/><text x="271" y="315" text-anchor="middle" class="mono" fill="#38BDF8" font-size="11">HTTP · 8080</text></g>

  <!-- nginx -> php-fpm -->
  <polyline points="441,298 441,322" fill="none" stroke="#2DD4BF" stroke-width="1.8" marker-end="url(#ah-teal)"/>
  <g><rect x="386" y="299" width="110" height="22" rx="6" fill="#0E1116" stroke="#2DD4BF" stroke-opacity="0.6"/><text x="441" y="314" text-anchor="middle" class="mono" fill="#2DD4BF" font-size="11">FastCGI · 9002</text></g>

  <!-- php-fpm -> misp-modules (own Service now, not localhost) -->
  <polyline points="441,462 441,492" fill="none" stroke="#2DD4BF" stroke-width="1.8" marker-end="url(#ah-teal)"/>
  <g><rect x="386" y="466" width="110" height="22" rx="6" fill="#0E1116" stroke="#2DD4BF" stroke-opacity="0.6"/><text x="441" y="481" text-anchor="middle" class="mono" fill="#2DD4BF" font-size="11">HTTP · 6666</text></g>

  <!-- php-fpm -> RDS -->
  <polyline points="556,378 884,378 884,228 900,228" fill="none" stroke="#E3B341" stroke-width="1.8" marker-end="url(#ah-sand)"/>
  <g><rect x="820" y="206" width="58" height="22" rx="6" fill="#0E1116" stroke="#E3B341" stroke-opacity="0.6"/><text x="849" y="221" text-anchor="middle" class="mono" fill="#E3B341" font-size="11">3306</text></g>

  <!-- php-fpm -> Redis -->
  <polyline points="556,400 872,400 872,343 900,343" fill="none" stroke="#E3B341" stroke-width="1.8" marker-end="url(#ah-sand)"/>
  <g><rect x="790" y="321" width="66" height="22" rx="6" fill="#0E1116" stroke="#E3B341" stroke-opacity="0.6"/><text x="823" y="336" text-anchor="middle" class="mono" fill="#E3B341" font-size="11">6379</text></g>

  <!-- php-fpm -> S3 -->
  <polyline points="556,422 860,422 860,458 900,458" fill="none" stroke="#E3B341" stroke-width="1.8" marker-end="url(#ah-sand)"/>
  <g><rect x="744" y="436" width="64" height="22" rx="6" fill="#0E1116" stroke="#E3B341" stroke-opacity="0.6"/><text x="776" y="451" text-anchor="middle" class="mono" fill="#E3B341" font-size="11">S3 keys</text></g>

  <!-- Secrets Manager -> pod (External Secrets) -->
  <polyline points="900,573 852,573 852,455 556,455" fill="none" stroke="#A78BFA" stroke-width="1.8" marker-end="url(#ah-violet)"/>
  <g><rect x="600" y="444" width="178" height="22" rx="6" fill="#0E1116" stroke="#A78BFA" stroke-opacity="0.6"/><text x="689" y="459" text-anchor="middle" class="mono" fill="#A78BFA" font-size="11">External Secrets · IRSA</text></g>

  <!-- caption -->
  <text x="270" y="688" class="mut" font-size="12.5">TLS terminates at the ALB; nginx serves :8080 (ConfigMap-driven, X-Forwarded-For trust). All state is externalized to RDS, ElastiCache, and S3.</text>

  <!-- legend -->
  <g font-size="12.5">
    <circle cx="40" cy="710" r="5" fill="#38BDF8"/><text x="52" y="714" class="mut">Edge / Web</text>
    <circle cx="182" cy="710" r="5" fill="#2DD4BF"/><text x="194" y="714" class="mut">EKS workloads</text>
    <circle cx="348" cy="710" r="5" fill="#E3B341"/><text x="360" y="714" class="mut">AWS managed data</text>
    <circle cx="552" cy="710" r="5" fill="#A78BFA"/><text x="564" y="714" class="mut">Secrets / identity</text>
  </g>
</svg>
