# AlienVault OTX external-import connector for the upstream OpenCTI stack.
#
# Option A (as shown on stream): copy the `connector-alienvault:` block into
# the upstream docker-compose.yml under top-level `services:`, alongside
# connector-mitre and connector-opencti. Keep two spaces of indentation.
#
# Option B: use this file as a Compose override from the opencti-getting-started dir:
#   docker compose -f docker-compose.yml -f compose/connector-alienvault.yml up -d connector-alienvault
#
# Secrets come from .env (see scripts/add_otx_settings.py). Never put them here.
# Pin an image tag that matches your OpenCTI platform release before going live;
# :latest is the upstream example default.
services:
  connector-alienvault:
    image: opencti/connector-alienvault:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${ALIENVAULT_CONNECTOR_ID}
      - CONNECTOR_NAME=AlienVault OTX
      - CONNECTOR_SCOPE=alienvault
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=PT30M
      - ALIENVAULT_BASE_URL=https://otx.alienvault.com
      - ALIENVAULT_API_KEY=${ALIENVAULT_API_KEY}
      - ALIENVAULT_TLP=White
      - ALIENVAULT_CREATE_OBSERVABLES=true
      - ALIENVAULT_CREATE_INDICATORS=true
      - ALIENVAULT_PULSE_START_TIMESTAMP=${ALIENVAULT_PULSE_START_TIMESTAMP}
      - ALIENVAULT_REPORT_TYPE=threat-report
      - ALIENVAULT_REPORT_STATUS=New
      - ALIENVAULT_GUESS_MALWARE=false
      - ALIENVAULT_GUESS_CVE=false
      - ALIENVAULT_ENABLE_RELATIONSHIPS=true
      - ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
